name: pegasusX SSMR Infra Gate

# Deprecated alias of sandbox-infra.yml. PEGASUSX_ENV=ssmr still means sandbox.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/ssmr-infra.yml'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/ssmr-infra.yml'

permissions:
  contents: read

jobs:
  ssmr-infra:
    name: pegasusX SSMR smoke gate (alias)
    uses: ./.github/workflows/sandbox-infra.yml
