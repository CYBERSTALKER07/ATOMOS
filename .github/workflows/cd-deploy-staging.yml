name: 03 - Deploy to Staging (GKE)
on:
  workflow_run:
    workflows: ["02 - Build and Push to GAR"]
    types:
      - completed
    branches: [ main ]
jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_ZONE }}
      - name: Kustomize and Apply (Staging)
        run: |
          cd infra/k8s/overlays/staging
          kustomize edit set image backend-go=${{ secrets.GAR_LOCATION }}/${{ secrets.GCP_PROJECT_ID }}/pegasus/backend-go:${{ github.sha }}
          kustomize build . | kubectl apply -f -
