# PegasusX native mobile clients — Android + iOS compile gates (all 12 apps).
name: PegasusX Native Mobile Build

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - "pegasusX/apps/*-app-android/**"
      - "pegasusX/apps/*-app-ios/**"
      - "pegasusX/packages/mobile-android-kit/**"
      - "pegasusX/packages/mobile-ios-kit/**"
      - "pegasusX/packages/mobile-ios-barcode/**"
      - "pegasusX/packages/mobile-ios-design/**"
      - "pegasusX/scripts/ci_android_apps.sh"
      - "pegasusX/scripts/ci_ios_apps.sh"
      - "pegasusX/scripts/build_native_android_store.sh"
      - ".github/workflows/pegasusx-native-mobile-build.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "pegasusX/apps/*-app-android/**"
      - "pegasusX/apps/*-app-ios/**"
      - "pegasusX/packages/mobile-android-kit/**"
      - "pegasusX/packages/mobile-ios-kit/**"
      - "pegasusX/packages/mobile-ios-barcode/**"
      - "pegasusX/packages/mobile-ios-design/**"
      - "pegasusX/scripts/ci_android_apps.sh"
      - "pegasusX/scripts/ci_ios_apps.sh"
      - ".github/workflows/pegasusx-native-mobile-build.yml"

concurrency:
  group: pegasusx-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android / ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app:
          - retailer-app-android
          - supplier-app-android
          - driver-app-android
          - warehouse-app-android
          - factory-app-android
          - payload-app-android
    defaults:
      run:
        working-directory: pegasusX/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin (storeDebug, fallback enterpriseDebug)
        run: |
          chmod +x ./gradlew
          if ./gradlew --no-daemon --stacktrace :app:compileStoreDebugKotlin; then
            echo "OK compileStoreDebugKotlin"
          else
            echo "storeDebug unavailable — compileEnterpriseDebugKotlin"
            ./gradlew --no-daemon --stacktrace :app:compileEnterpriseDebugKotlin
          fi

      - name: Assemble enterpriseDebug
        run: ./gradlew :app:assembleEnterpriseDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-enterprise-debug
          path: pegasusX/apps/${{ matrix.app }}/app/build/outputs/apk/enterprise/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: iOS / ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: retailer
            scheme: retailerapp
            project: pegasusX/apps/retailer-app-ios/retailerapp/retailerapp.xcodeproj
            xcodegen_dir: ""
          - name: supplier
            scheme: SupplierAppIOS
            project: pegasusX/apps/supplier-app-ios/SupplierAppIOS.xcodeproj
            xcodegen_dir: pegasusX/apps/supplier-app-ios
          - name: driver
            scheme: driverappios
            project: pegasusX/apps/driver-app-ios/driverappios/driverappios.xcodeproj
            xcodegen_dir: ""
          - name: warehouse
            scheme: WarehouseAppIOS
            project: pegasusX/apps/warehouse-app-ios/WarehouseAppIOS.xcodeproj
            xcodegen_dir: pegasusX/apps/warehouse-app-ios
          - name: factory
            scheme: FactoryAppIOS
            project: pegasusX/apps/factory-app-ios/FactoryAppIOS.xcodeproj
            xcodegen_dir: pegasusX/apps/factory-app-ios
          - name: payload
            scheme: payload-app-ios
            project: pegasusX/apps/payload-app-ios/payload-app-ios.xcodeproj
            xcodegen_dir: pegasusX/apps/payload-app-ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        if: matrix.xcodegen_dir != ''
        run: brew install xcodegen

      - name: Generate Xcode project
        if: matrix.xcodegen_dir != ''
        working-directory: ${{ matrix.xcodegen_dir }}
        run: xcodegen generate

      - name: Resolve package dependencies
        run: |
          xcodebuild -project "${{ matrix.project }}" -scheme "${{ matrix.scheme }}" \
            -resolvePackageDependencies || true

      - name: Build for iOS Simulator
        run: |
          if xcrun simctl list devices available | grep -q "iPhone 16"; then
            DEST_ARG='platform=iOS Simulator,name=iPhone 16'
          elif xcrun simctl list devices available | grep -q "iPhone 17"; then
            DEST_ARG='platform=iOS Simulator,name=iPhone 17'
          else
            DEST_ARG='generic/platform=iOS Simulator'
          fi
          echo "Using destination: $DEST_ARG"
          xcodebuild \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -destination "$DEST_ARG" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
