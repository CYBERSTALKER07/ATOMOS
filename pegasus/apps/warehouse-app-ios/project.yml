name: warehouse-app-ios
options:
  bundleIdPrefix: com.pegasus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Receive warehouse operations alerts"
targets:
  warehouse-app-ios:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    preBuildScripts:
      - name: Generate Native Event Contracts
        script: |
          set -euo pipefail
          REPO_ROOT="$SRCROOT/../../.."
          BACKEND_DIR="$REPO_ROOT/apps/backend-go"
          SCHEMA_PATH="$REPO_ROOT/contracts/events.schema.json"
          OUTPUT_PATH="$SRCROOT/WarehouseApp/Generated/PegasusWSEventEnvelope.swift"

          if ! command -v quicktype >/dev/null 2>&1; then
            echo "error: quicktype not found. Install quicktype and ensure it is on PATH." >&2
            exit 1
          fi

          mkdir -p "$SRCROOT/WarehouseApp/Generated"
          cd "$BACKEND_DIR"
          go run ./cmd/gen-contracts -source kafka/events.go -mode json-schema -schema-out "$SCHEMA_PATH" -pretty=true
          quicktype --lang swift --src-lang schema --src "$SCHEMA_PATH" --top-level PegasusWSEventEnvelope --just-types --out "$OUTPUT_PATH"
        outputFiles:
          - "$(SRCROOT)/WarehouseApp/Generated/PegasusWSEventEnvelope.swift"
    sources:
      - path: WarehouseApp
        excludes:
          - "**/.DS_Store"
    resources:
      - path: WarehouseApp/Assets.xcassets
    info:
      path: WarehouseApp/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pegasus.warehouse
        INFOPLIST_FILE: WarehouseApp/Info.plist
