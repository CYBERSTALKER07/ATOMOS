name: payload-app-ios
options:
  bundleIdPrefix: com.pegasus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    TARGETED_DEVICE_FAMILY: "2" # iPad only
    # Camera usage removed — barcode scanning out of ecosystem scope.
    # To reinstate: add INFOPLIST_KEY_NSCameraUsageDescription with a user-facing reason
    # and re-run `xcodegen generate`. See docs/BARCODE_SCANNING.md.
    INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Receive load-out and dispatch alerts"
targets:
  payload-app-ios:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    preBuildScripts:
      - name: Generate Native Event Contracts
        script: |
          set -euo pipefail
          REPO_ROOT="$SRCROOT/../../.."
          BACKEND_DIR="$REPO_ROOT/apps/backend-go"
          SCHEMA_PATH="$REPO_ROOT/contracts/events.schema.json"
          OUTPUT_PATH="$SRCROOT/payload-app-ios/Generated/PegasusWSEventEnvelope.swift"

          if ! command -v quicktype >/dev/null 2>&1; then
            echo "error: quicktype not found. Install quicktype and ensure it is on PATH." >&2
            exit 1
          fi

          mkdir -p "$SRCROOT/payload-app-ios/Generated"
          cd "$BACKEND_DIR"
          go run ./cmd/gen-contracts -source kafka/events.go -mode json-schema -schema-out "$SCHEMA_PATH" -pretty=true
          quicktype --lang swift --src-lang schema --src "$SCHEMA_PATH" --top-level PegasusWSEventEnvelope --just-types --out "$OUTPUT_PATH"
        outputFiles:
          - "$(SRCROOT)/payload-app-ios/Generated/PegasusWSEventEnvelope.swift"
    sources:
      - path: payload-app-ios
        excludes:
          - "**/.DS_Store"
    resources:
      - path: payload-app-ios/Assets.xcassets
    info:
      path: payload-app-ios/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pegasus.payload
        INFOPLIST_FILE: payload-app-ios/Info.plist
