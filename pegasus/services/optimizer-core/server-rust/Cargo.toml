[package]
name = "optimizer-core-rust"
version = "0.1.0"
edition = "2021"
description = "Rust gRPC sidecar scaffold for optimizer-core Pattern-A rollout"
license = "UNLICENSED"

[dependencies]
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
tonic-build = "0.12"
