[project]
name = "void-deep-agents"
version = "0.1.0"
description = "LangChain + Deep Agents workspace for the V.O.I.D / Pegasus monorepo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.7.5",
  "langchain>=1.3.0",
  "langchain-xai>=1.3.0",
  "langchain-openai>=1.4.0",
  "langgraph>=1.2.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
void-deep-agent = "void_deep_agents.cli:main"
void-ecosystem-audit = "void_deep_agents.ecosystem_audit:main"
void-e2e-fleet = "void_deep_agents.fleet_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
