apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
  labels:
    app: ai-worker
    app.kubernetes.io/name: ai-worker
    app.kubernetes.io/part-of: pegasusx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ai-worker
        app.kubernetes.io/name: ai-worker
        app.kubernetes.io/part-of: pegasusx
    spec:
      serviceAccountName: backend-go
      terminationGracePeriodSeconds: 60
      containers:
        - name: ai-worker
          image: asia-south1-docker.pkg.dev/pegasus-503013/pegasusx-staging-images/ai-worker:staging
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-worker-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-go-secrets
                  key: redis-password
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2