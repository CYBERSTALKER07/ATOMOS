name: PegasusCartograph
options:
  bundleIdPrefix: app.pegasusx
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
targets:
  PegasusCartograph:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pegasusx.cartograph
        PRODUCT_NAME: Pegasus Cartograph
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pegasus Cartograph
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "pegasusX origin/main fbfd134e"
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        SWIFT_VERSION: "5.9"
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_EMIT_LOC_STRINGS: NO
