---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: optimizer-core
    app.kubernetes.io/name: optimizer-core
    pegasusx.io/environment: staging
  name: optimizer-core
  namespace: pegasusx-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: optimizer-core
  template:
    metadata:
      labels:
        app: optimizer-core
        app.kubernetes.io/name: optimizer-core
    spec:
      containers:
      - env:
        - name: INTERNAL_API_KEY
          valueFrom:
