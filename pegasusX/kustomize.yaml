    secretKey: internal-api-key
  - remoteRef:
      key: pegasusx-ssmr-google-maps-api-key
    secretKey: google-maps-api-key
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: pegasusx-gsm
  target:
