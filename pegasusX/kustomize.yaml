        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              key: stripe-webhook-secret
              name: backend-go-secrets
        - name: PAYME_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              key: payme-webhook-secret
              name: backend-go-secrets
        - name: CLICK_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              key: click-webhook-secret
              name: backend-go-secrets
        - name: GLOBAL_PAY_SERVICE_ID
          valueFrom:
            secretKeyRef:
              key: global-pay-service-id
              name: backend-go-secrets
        - name: GLOBAL_PAY_USERNAME
          valueFrom:
            secretKeyRef:
              key: global-pay-username
              name: backend-go-secrets
        - name: GLOBAL_PAY_PASSWORD
          valueFrom:
            secretKeyRef:
              key: global-pay-password
              name: backend-go-secrets
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              key: internal-api-key
              name: backend-go-secrets
        - name: FIREBASE_CREDENTIALS_PATH
          value: /var/secrets/firebase/service-account.json
        envFrom:
        - configMapRef:
            name: backend-go-config
