apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ai-worker
    app.kubernetes.io/name: ai-worker
    app.kubernetes.io/part-of: pegasusx
    pegasusx.io/environment: staging
  name: ai-worker
  namespace: pegasusx-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-worker
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ai-worker
        app.kubernetes.io/name: ai-worker
        app.kubernetes.io/part-of: pegasusx
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: ai-worker-config
        image: PEGASUSX_AI_WORKER_IMAGE_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        name: ai-worker
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 256Mi
      serviceAccountName: backend-go
      terminationGracePeriodSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend-go
    app.kubernetes.io/name: backend-go
    app.kubernetes.io/part-of: pegasusx
    pegasusx.io/environment: staging
  name: backend-go
  namespace: pegasusx-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-go
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: backend-go
        app.kubernetes.io/name: backend-go
        app.kubernetes.io/part-of: pegasusx
    spec:
      containers:
      - env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: jwt-secret
              name: backend-go-secrets
        - name: GLOBAL_PAY_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              key: global-pay-webhook-secret
              name: backend-go-secrets
        - name: ADYEN_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              key: adyen-webhook-secret
              name: backend-go-secrets
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              key: stripe-webhook-secret
              name: backend-go-secrets
        - name: PAYME_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              key: payme-webhook-secret
              name: backend-go-secrets
        - name: CLICK_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              key: click-webhook-secret
              name: backend-go-secrets
        - name: GLOBAL_PAY_SERVICE_ID
          valueFrom:
            secretKeyRef:
              key: global-pay-service-id
              name: backend-go-secrets
        - name: GLOBAL_PAY_USERNAME
          valueFrom:
            secretKeyRef:
              key: global-pay-username
              name: backend-go-secrets
        - name: GLOBAL_PAY_PASSWORD
          valueFrom:
            secretKeyRef:
              key: global-pay-password
              name: backend-go-secrets
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              key: internal-api-key
              name: backend-go-secrets
        - name: GOOGLE_MAPS_API_KEY
          valueFrom:
            secretKeyRef:
              key: google-maps-api-key
              name: backend-go-secrets
              optional: true
        - name: FIREBASE_CREDENTIALS_PATH
          value: /var/secrets/firebase/service-account.json
        envFrom:
        - configMapRef:
            name: backend-go-config
        image: PEGASUSX_BACKEND_GO_IMAGE_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        name: backend-go
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - mountPath: /var/secrets/firebase
          name: firebase-credentials
          readOnly: true
      serviceAccountName: backend-go
      terminationGracePeriodSeconds: 30
      volumes:
      - name: firebase-credentials
        secret:
          optional: true
          secretName: backend-go-firebase
---
apiVersion: apps/v1
