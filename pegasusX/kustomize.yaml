              key: internal-api-key
              name: backend-go-secrets
        envFrom:
        - configMapRef:
            name: optimizer-core-config
        image: pegasusx-optimizer-core:local
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        name: optimizer-core
        ports:
        - containerPort: 8082
          name: http
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "2"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    pegasusx.io/environment: staging
  name: pegasusx-planning-training-export
  namespace: pegasusx-staging
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: pegasusx-planning-training-export
        spec:
          containers:
          - args:
            - -days
            - "30"
            - -format
            - jsonl
            command:
            - /usr/local/bin/planning-training-export
            envFrom:
            - secretRef:
                name: backend-go-secrets
            - configMapRef:
                name: backend-go-config
            image: us-central1-docker.pkg.dev/pegasusx-production/pegasusx/backend-go:latest
            name: planning-export
            resources:
              limits:
                cpu: 500m
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
          restartPolicy: OnFailure
  schedule: 30 2 * * *
  successfulJobsHistoryLimit: 7
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    pegasusx.io/environment: staging
  name: pegasusx-predictive-push
  namespace: pegasusx-staging
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: pegasusx-predictive-push
        spec:
          containers:
          - command:
            - /app/ai-worker
            env:
            - name: AI_WORKER_MODE
              value: predictive-push-cron
            envFrom:
            - secretRef:
                name: backend-go-secrets
            - configMapRef:
                name: backend-go-config
            image: us-central1-docker.pkg.dev/pegasusx-production/pegasusx/ai-worker:latest
            name: ai-worker
            resources:
              limits:
                cpu: "1"
                memory: 2Gi
              requests:
                cpu: 500m
                memory: 1Gi
          restartPolicy: OnFailure
  schedule: 0 1 * * *
  successfulJobsHistoryLimit: 3
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app: backend-go
    app.kubernetes.io/part-of: pegasusx
    pegasusx.io/environment: staging
  name: backend-go
  namespace: pegasusx-staging
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: backend-go
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    app: backend-go
    app.kubernetes.io/part-of: pegasusx
    pegasusx.io/environment: staging
  name: backend-go
  namespace: pegasusx-staging
spec:
  maxReplicas: 12
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 3
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-go
---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: backend-go
    app.kubernetes.io/component: migrate
    app.kubernetes.io/part-of: pegasusx
    pegasusx.io/environment: staging
  name: backend-go-migrate
  namespace: pegasusx-staging
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: backend-go
        app.kubernetes.io/component: migrate
    spec:
      containers:
      - command:
        - /usr/local/bin/pegasusx-setup
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: jwt-secret
              name: backend-go-secrets
        envFrom:
        - configMapRef:
            name: backend-go-config
        image: PEGASUSX_BACKEND_GO_IMAGE_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        name: migrate
        workingDir: /runtime
      restartPolicy: OnFailure
      serviceAccountName: backend-go
  ttlSecondsAfterFinished: 86400
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  labels:
    app.kubernetes.io/part-of: pegasusx
    pegasusx.io/environment: staging
  name: pegasusx-api-backendconfig
  namespace: pegasusx-staging
spec:
  connectionDraining:
    drainingTimeoutSec: 30
  timeoutSec: 120
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  labels:
    app.kubernetes.io/part-of: pegasusx
    pegasusx.io/environment: staging
  name: pegasusx-ws-backendconfig
  namespace: pegasusx-staging
spec:
  connectionDraining:
    drainingTimeoutSec: 60
  sessionAffinity:
    affinityCookieTtlSec: 3600
    affinityType: GENERATED_COOKIE
  timeoutSec: 3600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/part-of: pegasusx
    pegasusx.io/environment: staging
  name: backend-go-secrets
  namespace: pegasusx-staging
spec:
  data:
  - remoteRef:
      key: pegasusx-ssmr-jwt-secret
    secretKey: jwt-secret
  - remoteRef:
      key: pegasusx-ssmr-global-pay-webhook-secret
    secretKey: global-pay-webhook-secret
  - remoteRef:
      key: pegasusx-ssmr-adyen-webhook-secret
    secretKey: adyen-webhook-secret
  - remoteRef:
      key: pegasusx-ssmr-stripe-webhook-secret
    secretKey: stripe-webhook-secret
  - remoteRef:
      key: pegasusx-ssmr-payme-webhook-secret
    secretKey: payme-webhook-secret
  - remoteRef:
      key: pegasusx-ssmr-click-webhook-secret
    secretKey: click-webhook-secret
  - remoteRef:
      key: pegasusx-ssmr-global-pay-service-id
    secretKey: global-pay-service-id
  - remoteRef:
      key: pegasusx-ssmr-global-pay-username
    secretKey: global-pay-username
  - remoteRef:
