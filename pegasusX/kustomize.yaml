metadata:
  annotations:
    cloud.google.com/backend-config: '{"default": "pegasusx-api-backendconfig"}'
    kubernetes.io/ingress.class: gce
    networking.gke.io/v1beta1.FrontendConfig: pegasusx-frontend
  labels:
    app.kubernetes.io/part-of: pegasusx
    pegasusx.io/environment: staging
  name: pegasusx-api
  namespace: pegasusx-staging
spec:
  rules:
  - host: api.pegasusx.app
    http:
      paths:
      - backend:
          service:
            name: backend-go-ws
            port:
              number: 80
        path: /v1/ws
        pathType: Prefix
      - backend:
          service:
            name: backend-go
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - api.pegasusx.app
    secretName: pegasusx-api-tls
