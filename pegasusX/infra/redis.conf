# PegasusX Enterprise Redis Configuration
# Hardened according to enterprise Redis skills: redis-security, redis-performance, redis-observability, redis-core

# ── Network & Perimeter Security (redis-security) ────────────────────────────
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 60
timeout 300

# ── Security Hardening & ACL Least Privilege (redis-security) ────────────────
# Block dangerous administrative and destructive commands from application tenants
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
# Production ACL users (uncomment or inject via mounted aclfile in K8s Secret):
# user app_readonly on >replace-with-readonly-secret ~* &cache:invalidate +@read +scan +hscan +sscan +zscan +ping +subscribe
# user app_writer   on >replace-with-writer-secret   ~* &cache:invalidate +@all -@dangerous -@admin

# ── Persistence (RDB & AOF) ───────────────────────────────────────────────────
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 3600 1 300 100 60 10000

# ── Memory, Eviction & Lazy Freeing (redis-performance & cache-redis-correctness)
maxmemory 2048mb
# allkeys-lru guarantees bounded memory headroom under high cache/session throughput
maxmemory-policy allkeys-lru
maxmemory-samples 10
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ── Active Defragmentation (redis-performance) ─────────────────────────────────
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 30

# ── Clients & Connections (redis-connections) ─────────────────────────────────
maxclients 10000

# ── Observability & Triage (redis-observability) ──────────────────────────────
# Log commands executing slower than 10ms (10,000 microseconds)
slowlog-log-slower-than 10000
slowlog-max-len 128
# Latency monitor sampled at 100ms threshold
latency-monitor-threshold 100

# ── Event Loop & HZ ───────────────────────────────────────────────────────────
hz 10
dynamic-hz yes
