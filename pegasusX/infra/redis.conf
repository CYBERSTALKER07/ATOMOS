# PegasusX Enterprise Redis Configuration Template
# This file serves as documentation for production behavior
# Local development is configured identically via docker-compose commands

# Network
bind 0.0.0.0
port 6379
tcp-keepalive 60
timeout 300

# Security
# requirepass ${REDIS_PASSWORD} # Provided by GCP Memorystore
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# Persistence
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save "" # Disable RDB in favor of AOF

# Memory
maxmemory 256mb # Tuned based on GCP standard tier or local Docker
maxmemory-policy allkeys-lru

# Clients
maxclients 10000

# Advanced Tuning
hz 10
dynamic-hz yes
activedefrag yes
