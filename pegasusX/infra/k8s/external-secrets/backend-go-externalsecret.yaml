apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: pegasusx-gsm
  namespace: pegasusx
  labels:
    app.kubernetes.io/part-of: pegasusx
spec:
  provider:
    gcpsm:
      projectID: PEGASUSX_GCP_PROJECT_PLACEHOLDER
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: backend-go
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-go-secrets
  namespace: pegasusx
  labels:
    app.kubernetes.io/part-of: pegasusx
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: pegasusx-gsm
    kind: SecretStore
  target:
    name: backend-go-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: PEGASUSX_JWT_SECRET_GSM_NAME_PLACEHOLDER
    - secretKey: global-pay-webhook-secret
      remoteRef:
        key: PEGASUSX_GLOBAL_PAY_WEBHOOK_GSM_NAME_PLACEHOLDER
    - secretKey: adyen-webhook-secret
      remoteRef:
        key: PEGASUSX_ADYEN_WEBHOOK_GSM_NAME_PLACEHOLDER
    - secretKey: stripe-webhook-secret
      remoteRef:
        key: PEGASUSX_STRIPE_WEBHOOK_GSM_NAME_PLACEHOLDER
    - secretKey: payme-webhook-secret
      remoteRef:
        key: PEGASUSX_PAYME_WEBHOOK_GSM_NAME_PLACEHOLDER
    - secretKey: click-webhook-secret
      remoteRef:
        key: PEGASUSX_CLICK_WEBHOOK_GSM_NAME_PLACEHOLDER
    - secretKey: global-pay-service-id
      remoteRef:
        key: PEGASUSX_GLOBAL_PAY_SERVICE_ID_GSM_NAME_PLACEHOLDER
    - secretKey: global-pay-username
      remoteRef:
        key: PEGASUSX_GLOBAL_PAY_USERNAME_GSM_NAME_PLACEHOLDER
    - secretKey: global-pay-password
      remoteRef:
        key: PEGASUSX_GLOBAL_PAY_PASSWORD_GSM_NAME_PLACEHOLDER
    - secretKey: internal-api-key
      remoteRef:
        key: PEGASUSX_INTERNAL_API_KEY_GSM_NAME_PLACEHOLDER
    - secretKey: google-maps-api-key
      remoteRef:
        key: PEGASUSX_GOOGLE_MAPS_API_KEY_GSM_NAME_PLACEHOLDER
