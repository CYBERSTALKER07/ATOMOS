apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pegasusx-gsm
  namespace: pegasusx
  labels:
    app.kubernetes.io/part-of: pegasusx
spec:
  provider:
    gcpsm:
      projectID: pegasus-503013
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: backend-go
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-go-secrets
  namespace: pegasusx
  labels:
    app.kubernetes.io/part-of: pegasusx
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: pegasusx-gsm
    kind: SecretStore
  target:
    name: backend-go-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: pegasusx-ssmr-jwt-secret
    - secretKey: global-pay-webhook-secret
      remoteRef:
        key: pegasusx-ssmr-global-pay-webhook-secret
    - secretKey: adyen-webhook-secret
      remoteRef:
        key: pegasusx-ssmr-adyen-webhook-secret
    - secretKey: stripe-webhook-secret
      remoteRef:
        key: pegasusx-ssmr-stripe-webhook-secret
    - secretKey: payme-webhook-secret
      remoteRef:
        key: pegasusx-ssmr-payme-webhook-secret
    - secretKey: click-webhook-secret
      remoteRef:
        key: pegasusx-ssmr-click-webhook-secret
    - secretKey: global-pay-service-id
      remoteRef:
        key: pegasusx-ssmr-global-pay-service-id
    - secretKey: global-pay-username
      remoteRef:
        key: pegasusx-ssmr-global-pay-username
    - secretKey: global-pay-password
      remoteRef:
        key: pegasusx-ssmr-global-pay-password
    - secretKey: internal-api-key
      remoteRef:
        key: pegasusx-ssmr-internal-api-key
    - secretKey: google-maps-api-key
      remoteRef:
        key: pegasusx-ssmr-google-maps-api-key
