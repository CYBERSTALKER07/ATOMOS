apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-go-eimzo
  namespace: pegasusx
  labels:
    app: backend-go
    app.kubernetes.io/part-of: pegasusx
spec:
  refreshInterval: 6h
  secretStoreRef:
    name: pegasusx-gsm
    kind: SecretStore
  target:
    name: backend-go-eimzo
    creationPolicy: Owner
  data:
    - secretKey: signer.p12
      remoteRef:
        key: pegasusx-ssmr-fiscal-my-soliq-pkcs12-b64
        decodingStrategy: Base64
