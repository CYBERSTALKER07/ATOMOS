apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-go-config
  labels:
    app: backend-go
    app.kubernetes.io/part-of: pegasusx
data:
  # backend-go reads HTTP_PORT (not PORT).
  HTTP_PORT: "8080"
  PEGASUSX_ENV: "production"
  REDIS_ADDR: "redis.pegasusx.svc.cluster.local:6379"
  REDIS_TLS_ENABLED: "true"
  KAFKA_BROKERS: "kafka.pegasusx.svc.cluster.local:9092"
  KAFKA_TOPIC_MAIN: "pegasusx-main"
  KAFKA_TOPIC_FREEZE_LOCKS: "pegasusx-freeze-locks"
  KAFKA_TOPIC_INVENTORY_IMPORT: "pegasusx-inventory-import"
  # Domain topics (dual-write when KAFKA_TOPIC_DUAL_WRITE=true on relay)
  KAFKA_TOPIC_ORDERS: "pegasusx-orders"
  KAFKA_TOPIC_DISPATCH: "pegasusx-dispatch"
  KAFKA_TOPIC_REALTIME: "pegasusx-realtime"
  KAFKA_TOPIC_WEBHOOKS: "pegasusx-webhooks"
  SPANNER_PROJECT: "pegasusx-prod"
  SPANNER_INSTANCE: "pegasusx-instance"
  SPANNER_DATABASE: "pegasusx-db"
  GCS_BUCKET_NAME: "pegasusx-prod-catalog"
  # Geometry: Google Routes (GOOGLE_MAPS_API_KEY) → OSRM → dense. auto|google|osrm
  ROUTING_PROVIDER: "auto"
  # Optional regional fallback when OSRM PVC extract is loaded.
  ROUTING_OSRM_URL: "http://osrm.pegasusx.svc.cluster.local:5000"
  OPTIMIZER_BASE_URL: "http://optimizer-core.pegasusx.svc.cluster.local:8082"
  GLOBAL_PAY_ENV: "production"
  WS_ALLOWED_ORIGINS: "https://supplier.pegasusx.app,https://warehouse.pegasusx.app,https://factory.pegasusx.app,https://retailer.pegasusx.app"
  PUBLIC_BASE_URL: "https://api.pegasusx.app"
  FIREBASE_PROJECT_ID: "pegasusx-prod"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  REQUIRE_INFRA_ADAPTERS: "true"
  RELIABILITY_MIDDLEWARE_ENABLED: "true"
  FIREBASE_AUTH_ENABLED: "true"
  # G19 / G3 claim window defaults (supplier/WH policies override at COMPLETED snapshot)
  CLAIM_WINDOW_HOURS: "48"
  CLAIM_AUTO_APPROVE_MAX_MINOR: "0"
  CREDIT_NOTE_AUTO_FROM_CLAIM: "false"
  # AR / collections — enable on SSMR after credit policy soak; prod flip is ops-owned.
  AR_INVOICES_ENABLED: "false"
  AR_DUNNING_ENABLED: "false"
  # Phase 2 partner integration — EDI on; SFTP/AS2 off until tenant configs + host keys land.
  # Staging overlay flips SFTP/AS2 on. SSMR compose uses .env.ssmr.example.
  PARTNER_EDI_ENABLED: "true"
  PARTNER_SFTP_ENABLED: "false"
  PARTNER_SFTP_STRICT_HOSTKEY: "true"
  PARTNER_AS2_ENABLED: "false"
  PARTNER_AS2_INSECURE_PLAIN: "false"
  # §8.4 forecast accuracy — enable after ForecastAccuracyDaily migration + soak.
  # Prod overlay merges FORECAST_ACCURACY_ENABLED=true for soak evidence (W4).
  FORECAST_ACCURACY_ENABLED: "false"
  # §8.1 Croston/SES/HW — enable after backtest gate soak on real history.
  FORECAST_ALGO_ENABLED: "false"
  FORECAST_ALGO_REQUIRE_GATE: "false"
  # §8.2 service-level safety stock — enable after ReceivedAt history + policy soak.
  SAFETY_STOCK_V2_ENABLED: "false"
  # Auto-order shadow worker (place stays off until dual-control flip).
  AUTO_ORDER_SHADOW_ENABLED: "false"
  AUTO_ORDER_WORKER_ENABLED: "false"
  AUTO_ORDER_PLACE_ENABLED: "false"
  CLAIM_EVIDENCE_MAX_BYTES: "10485760"
  # PEGASUSX_RUN_MODE: api | worker | all (default all). Worker Deployment sets worker.
  PEGASUSX_RUN_MODE: "api"
  # GOOGLE_MAPS_API_KEY from backend-go-secrets (GSM) — Geocoding, Places, and Routes geometry.
  AIRWALLEX_DIRECT_EXECUTION_ENABLED: "false"
  # DDL runs via infra/k8s/backend-go/migrate-job.yaml — never on pod boot.
