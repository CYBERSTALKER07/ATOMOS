apiVersion: batch/v1
kind: Job
metadata:
  name: backend-go-migrate
  namespace: pegasusx
  labels:
    app: backend-go
    app.kubernetes.io/component: migrate
    app.kubernetes.io/part-of: pegasusx
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: backend-go
        app.kubernetes.io/component: migrate
        cost-center: platform-engineering
        workload-tier: migration
    spec:
      serviceAccountName: backend-go
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: PEGASUSX_BACKEND_GO_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          workingDir: /runtime
          command: ["/usr/local/bin/pegasusx-setup"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: backend-go-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-go-secrets
                  key: jwt-secret
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
