apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-go
  labels:
    app: backend-go
    app.kubernetes.io/name: backend-go
    app.kubernetes.io/part-of: pegasusx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-go
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend-go
        app.kubernetes.io/name: backend-go
        app.kubernetes.io/part-of: pegasusx
    spec:
      serviceAccountName: backend-go
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend-go
          image: PEGASUSX_BACKEND_GO_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-go-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-go-secrets
                  key: jwt-secret
            - name: GLOBAL_PAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-go-secrets
                  key: global-pay-webhook-secret
            - name: ADYEN_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-go-secrets
                  key: adyen-webhook-secret
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-go-secrets
                  key: stripe-webhook-secret
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-go-secrets
                  key: redis-password
            - name: PAYME_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-go-secrets
                  key: payme-webhook-secret
            - name: CLICK_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-go-secrets
                  key: click-webhook-secret
            - name: GLOBAL_PAY_SERVICE_ID
              valueFrom:
                secretKeyRef:
                  name: backend-go-secrets
                  key: global-pay-service-id
            - name: GLOBAL_PAY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-go-secrets
                  key: global-pay-username
            - name: GLOBAL_PAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-go-secrets
                  key: global-pay-password
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-go-secrets
                  key: internal-api-key
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-go-secrets
                  key: google-maps-api-key
                  optional: true
            - name: FIREBASE_CREDENTIALS_PATH
              value: /var/secrets/firebase/service-account.json
          volumeMounts:
            - name: firebase-credentials
              mountPath: /var/secrets/firebase
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: "1000m"
              memory: 512Mi
      volumes:
        - name: firebase-credentials
          secret:
            secretName: backend-go-firebase
            optional: true
