apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-go
  namespace: pegasusx
  labels:
    app: backend-go
    app.kubernetes.io/part-of: pegasusx
    security.pegasusx.io/workload-identity: enabled
  annotations:
    # Bound via Terraform google_service_account_iam_member.workload_identity_binding_backend_go
    iam.gke.io/gcp-service-account: backend-go-sa@pegasusx-prod-uz.iam.gserviceaccount.com
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-worker-sa
  namespace: pegasusx
  labels:
    app: ai-worker
    app.kubernetes.io/part-of: pegasusx
    security.pegasusx.io/workload-identity: enabled
  annotations:
    # Least-privilege GSA (Spanner, Kafka, GCS Viewer only — no SecretManager admin)
    iam.gke.io/gcp-service-account: ai-worker-sa@pegasusx-prod-uz.iam.gserviceaccount.com
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: optimizer-sa
  namespace: pegasusx
  labels:
    app: optimizer-core
    app.kubernetes.io/part-of: pegasusx
    security.pegasusx.io/workload-identity: enabled
  annotations:
    # Least-privilege GSA (Spanner databaseUser only)
    iam.gke.io/gcp-service-account: optimizer-sa@pegasusx-prod-uz.iam.gserviceaccount.com
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: osrm-sa
  namespace: pegasusx
  labels:
    app: osrm
    app.kubernetes.io/part-of: pegasusx
automountServiceAccountToken: false
