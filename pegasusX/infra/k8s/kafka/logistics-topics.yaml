# Strimzi topics for logistics exceptions + telemetry.
# Matches HA cluster defaults: RF=3, min.insync.replicas=2.
# Apply: kubectl apply -f infra/k8s/kafka/logistics-topics.yaml
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: logistics-exceptions-v1
  namespace: kafka
  labels:
    strimzi.io/cluster: pegasusx
    app.kubernetes.io/part-of: pegasusx
spec:
  topicName: logistics.exceptions.v1
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: "2"
    cleanup.policy: delete
    retention.ms: "604800000" # 7d
    retention.bytes: "1073741824"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: logistics-telemetry-v1
  namespace: kafka
  labels:
    strimzi.io/cluster: pegasusx
    app.kubernetes.io/part-of: pegasusx
spec:
  topicName: logistics.telemetry.v1
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: "2"
    cleanup.policy: delete
    retention.ms: "259200000" # 3d
    retention.bytes: "2147483648"
