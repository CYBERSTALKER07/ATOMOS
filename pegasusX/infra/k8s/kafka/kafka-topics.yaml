# Strimzi KafkaTopic inventory (cluster: pegasusx, ns: kafka).
# Must match infra/k8s/kafka.yaml HA defaults: RF=3, min.insync.replicas=2.
# Apply: kubectl apply -f infra/k8s/kafka/kafka-topics.yaml
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: pegasusx-main
  namespace: kafka
  labels:
    strimzi.io/cluster: pegasusx
    app.kubernetes.io/part-of: pegasusx
spec:
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: "2"
    cleanup.policy: delete
    retention.ms: "604800000" # 7d
    retention.bytes: "1073741824" # 1Gi soft cap per partition
---
