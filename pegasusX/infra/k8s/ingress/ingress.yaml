apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pegasusx-api
  labels:
    app.kubernetes.io/part-of: pegasusx
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/v1beta1.FrontendConfig: pegasusx-frontend
    # Attach BackendConfig for REST timeouts (smart dispatch execute).
    cloud.google.com/backend-config: '{"default": "pegasusx-api-backendconfig"}'
spec:
  tls:
    - hosts:
        - api.pegasusx.app
      secretName: pegasusx-api-tls
  rules:
    - host: api.pegasusx.app
      http:
        paths:
          - path: /v1/ws
            pathType: Prefix
            backend:
              service:
                name: backend-go-ws
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-go
                port:
                  number: 80
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: pegasusx-frontend
  labels:
    app.kubernetes.io/part-of: pegasusx
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT
