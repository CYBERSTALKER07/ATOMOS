apiVersion: batch/v1
kind: CronJob
metadata:
  name: pegasusx-planning-training-export
  namespace: pegasusx
spec:
  schedule: "30 2 * * *" # Daily 02:30 UTC — after predictive-push baseline write
  startingDeadlineSeconds: 600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: pegasusx-planning-training-export
            cost-center: platform-engineering
            workload-tier: batch-cron
            pricing-model: spot
        spec:
          serviceAccountName: backend-go
          automountServiceAccountToken: false
          priorityClassName: pegasusx-batch-spot
          terminationGracePeriodSeconds: 30
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          tolerations:
            - key: "cloud.google.com/gke-spot"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: cloud.google.com/gke-spot
                        operator: In
                        values:
                          - "true"
          containers:
            - name: planning-export
              image: us-central1-docker.pkg.dev/pegasusx-production/pegasusx/backend-go:latest
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - "/usr/local/bin/planning-training-export"
              args:
                - "-days"
                - "30"
                - "-format"
                - "jsonl"
              envFrom:
                - secretRef:
                    name: backend-go-secrets
                - configMapRef:
                    name: backend-go-config
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "500m"
                  memory: "1Gi"
          volumes:
            - name: tmp
              emptyDir: {}
