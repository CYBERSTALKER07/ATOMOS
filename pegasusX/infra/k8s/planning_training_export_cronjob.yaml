apiVersion: batch/v1
kind: CronJob
metadata:
  name: pegasusx-planning-training-export
  namespace: pegasusx-production
spec:
  schedule: "30 2 * * *" # Daily 02:30 UTC — after predictive-push baseline write
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: pegasusx-planning-training-export
        spec:
          containers:
          - name: planning-export
            image: us-central1-docker.pkg.dev/pegasusx-production/pegasusx/backend-go:latest
            command:
            - "/usr/local/bin/planning-training-export"
            args:
            - "-days"
            - "30"
            - "-format"
            - "jsonl"
            envFrom:
            - secretRef:
                name: pegasusx-spanner-credentials
            - configMapRef:
                name: pegasusx-backend-config
            resources:
              requests:
                cpu: "250m"
                memory: "512Mi"
              limits:
                cpu: "500m"
                memory: "1Gi"
          restartPolicy: OnFailure
