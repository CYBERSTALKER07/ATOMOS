# Staging GSM names for pegasus-503013 (replace placeholders from base ExternalSecret).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: pegasusx-gsm
  namespace: pegasusx-staging
spec:
  provider:
    gcpsm:
      projectID: pegasus-503013
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: backend-go
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-go-secrets
  namespace: pegasusx-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: pegasusx-gsm
    kind: SecretStore
  target:
    name: backend-go-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: pegasusx-staging-jwt-secret
    - secretKey: internal-api-key
      remoteRef:
        key: pegasusx-staging-internal-api-key
    - secretKey: kafka-bootstrap-servers
      remoteRef:
        key: pegasusx-staging-kafka-bootstrap-servers
    - secretKey: redis-auth
      remoteRef:
        key: pegasusx-staging-redis-auth
    - secretKey: redis-addr
      remoteRef:
        key: pegasusx-staging-redis-addr
    - secretKey: global-pay-webhook-secret
      remoteRef:
        key: pegasusx-staging-global-pay-webhook-secret
    - secretKey: google-maps-api-key
      remoteRef:
        key: pegasusx-staging-google-maps-api-key
