apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pegasusx-staging

resources:
  - ../prod
  - ../../external-secrets/backend-go-externalsecret.yaml

patches:
  - target:
      kind: Deployment
      name: backend-go
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 100Mi
  - target:
      kind: Deployment
      name: backend-go-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 100Mi
  - target:
      kind: Deployment
      name: ai-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 100Mi
  - target:
      kind: Deployment
      name: optimizer-core
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 100Mi
  - target:
      kind: Deployment
      name: osrm
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 100Mi

configMapGenerator:
  - name: backend-go-config
    behavior: merge
    literals:
      - PEGASUSX_ENV=staging
      - REQUIRE_INFRA_ADAPTERS=true
      - GLOBAL_PAY_ENV=staging
      - FISCAL_PROVIDER=PEGASUS
      # Phase 1: AR active end-to-end on staging (credit leave -> invoice ->
      # aging -> dunning -> hold -> payment -> release). Off-app channels stay
      # off until provider creds land (DUNNING_SMS_PROVIDER/DUNNING_EMAIL_PROVIDER).
      - AR_INVOICES_ENABLED=true
      - AR_DUNNING_ENABLED=true
      - CLAIM_WINDOW_HOURS=48
      - CLAIM_AUTO_APPROVE_MAX_MINOR=0
      - CREDIT_NOTE_AUTO_FROM_CLAIM=false
      - CLAIM_EVIDENCE_MAX_BYTES=10485760
      - SPANNER_PROJECT=pegasus-503013
      - SPANNER_INSTANCE=pegasusx-staging-spanner
      - SPANNER_DATABASE=pegasusx-staging-db
      - REDIS_ADDR=10.175.232.20:6378
      - REDIS_TLS_ENABLED=true
      - KAFKA_BROKERS=bootstrap.pegasusx-staging-kafka.asia-south1.managedkafka.pegasus-503013.cloud.goog:9092
      - KAFKA_AUTH_MODE=GCP_MANAGED_OAUTH
      - KAFKA_SASL_USERNAME=staging-backend@pegasus-503013.iam.gserviceaccount.com
      - KAFKA_TOPIC_MAIN=staging.events.orders
      - KAFKA_TOPIC_MAIN_DLQ=staging.events.orders-dlq
      - KAFKA_TOPIC_ORDERS=staging.events.orders
      - KAFKA_TOPIC_DISPATCH=staging.events.orders
      - KAFKA_TOPIC_REALTIME=staging.events.realtime
      - KAFKA_TOPIC_WEBHOOKS=staging.events.webhooks
      - KAFKA_TOPIC_FREEZE_LOCKS=staging.events.freeze-locks
      - KAFKA_TOPIC_INVENTORY_IMPORT=staging.events.inventory-import
      - KAFKA_TOPIC_DUAL_WRITE=false
      # Must stay false unless dual-write is true; otherwise order mutator
      # listens on empty domain topics and fiscal stays PENDING forever.
      - KAFKA_TOPIC_CONSUME_DOMAIN=false
      - FIREBASE_AUTH_ENABLED=false
      - OPTIMIZER_BASE_URL=http://optimizer-core:8082

labels:
  - pairs:
      pegasusx.io/environment: staging

images:
  - name: PEGASUSX_BACKEND_GO_IMAGE_PLACEHOLDER
    newName: asia-south1-docker.pkg.dev/pegasus-503013/pegasusx-staging-images/backend-go
    newTag: staging
  - name: PEGASUSX_AI_WORKER_IMAGE_PLACEHOLDER
    newName: asia-south1-docker.pkg.dev/pegasus-503013/pegasusx-staging-images/ai-worker
    newTag: staging
  - name: pegasusx-optimizer-core:local
    newName: asia-south1-docker.pkg.dev/pegasus-503013/pegasusx-staging-images/optimizer-core
    newTag: staging
  - name: us-central1-docker.pkg.dev/pegasusx-production/pegasusx/ai-worker:latest
    newName: asia-south1-docker.pkg.dev/pegasus-503013/pegasusx-staging-images/ai-worker
    newTag: staging
  - name: us-central1-docker.pkg.dev/pegasusx-production/pegasusx/backend-go:latest
    newName: asia-south1-docker.pkg.dev/pegasus-503013/pegasusx-staging-images/backend-go
    newTag: staging
