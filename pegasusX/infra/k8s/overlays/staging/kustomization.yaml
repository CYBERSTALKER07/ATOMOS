apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pegasusx-staging

resources:
  - ../prod
  - ../../external-secrets/backend-go-externalsecret.yaml

patches:
  - target:
      kind: Deployment
      name: backend-go
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: backend-go-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

configMapGenerator:
  - name: backend-go-config
    behavior: merge
    literals:
      - PEGASUSX_ENV=staging
      - REQUIRE_INFRA_ADAPTERS=true
      - GLOBAL_PAY_ENV=staging
      - FISCAL_PROVIDER=FAKE
      - SPANNER_PROJECT=pegasus-503013
      - SPANNER_INSTANCE=pegasusx-staging-spanner
      - SPANNER_DATABASE=pegasusx-staging-db
      - REDIS_ADDR=10.175.232.20:6378
      - REDIS_TLS_ENABLED=true
      - KAFKA_BROKERS=bootstrap.pegasusx-staging-kafka.asia-south1.managedkafka.pegasus-503013.cloud.goog:9092
      - KAFKA_AUTH_MODE=GCP_MANAGED_OAUTH
      - KAFKA_SASL_USERNAME=staging-backend@pegasus-503013.iam.gserviceaccount.com
      - KAFKA_TOPIC_MAIN=staging.events.orders
      - KAFKA_TOPIC_MAIN_DLQ=staging.events.orders-dlq
      - KAFKA_TOPIC_ORDERS=staging.events.orders
      - KAFKA_TOPIC_DISPATCH=staging.events.orders
      - KAFKA_TOPIC_REALTIME=staging.events.realtime
      - KAFKA_TOPIC_WEBHOOKS=staging.events.webhooks
      - KAFKA_TOPIC_FREEZE_LOCKS=staging.events.freeze-locks
      - KAFKA_TOPIC_INVENTORY_IMPORT=staging.events.inventory-import
      - KAFKA_TOPIC_DUAL_WRITE=false
      - KAFKA_TOPIC_CONSUME_DOMAIN=true
      - FIREBASE_AUTH_ENABLED=false
      - OPTIMIZER_BASE_URL=http://optimizer-core:8082

labels:
  - pairs:
      pegasusx.io/environment: staging
