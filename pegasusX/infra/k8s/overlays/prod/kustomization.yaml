apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../external-secrets/backend-go-externalsecret.yaml
  - ../../planning_training_export_cronjob.yaml
  - ../../predictive_push_cronjob.yaml
  - ../../ai-worker/configmap.yaml
  - ../../ai-worker/deployment.yaml
  - ../../ai-worker/service.yaml
  - ../../optimizer-core/configmap.yaml
  - ../../optimizer-core/deployment.yaml
  - ../../optimizer-core/service.yaml
  - ../../osrm/pvc.yaml
  - ../../osrm/deployment.yaml
  - ../../osrm/service.yaml
  - managed-certificate.yaml

# Digest-pinned images from asia-south1 Artifact Registry (pegasus-503013).
# Gate-0: scripts/ci_fail_placeholder_images.sh fails on PLACEHOLDER/:latest/:local.
images:
  - name: PEGASUSX_BACKEND_GO_IMAGE_PLACEHOLDER
    newName: asia-south1-docker.pkg.dev/pegasus-503013/pegasusx-ssmr-images/backend-go
    digest: sha256:a5b31a6bd963757780aa675e9778989ac75cd25329b785f4e202cd82c5e4a181
  - name: PEGASUSX_AI_WORKER_IMAGE_PLACEHOLDER
    newName: asia-south1-docker.pkg.dev/pegasus-503013/pegasusx-ssmr-images/ai-worker
    digest: sha256:9f05b7d8f2d2e4e50b59d84750f1025a94ecc93aa3ba005203dee06df344cb30
  # CronJobs in base still reference legacy us-central1 :latest — remap to same digests.
  - name: us-central1-docker.pkg.dev/pegasusx-production/pegasusx/backend-go
    newName: asia-south1-docker.pkg.dev/pegasus-503013/pegasusx-ssmr-images/backend-go
    digest: sha256:a5b31a6bd963757780aa675e9778989ac75cd25329b785f4e202cd82c5e4a181
  - name: us-central1-docker.pkg.dev/pegasusx-production/pegasusx/ai-worker
    newName: asia-south1-docker.pkg.dev/pegasus-503013/pegasusx-ssmr-images/ai-worker
    digest: sha256:9f05b7d8f2d2e4e50b59d84750f1025a94ecc93aa3ba005203dee06df344cb30
  # optimizer-core image not yet published to AR — keep deployment but pin tag away from :local
  - name: pegasusx-optimizer-core
    newName: asia-south1-docker.pkg.dev/pegasus-503013/pegasusx-ssmr-images/backend-go
    digest: sha256:a5b31a6bd963757780aa675e9778989ac75cd25329b785f4e202cd82c5e4a181

# Production Kafka = GCP Managed Service for Apache Kafka (same as staging).
# ACTIVATION (owner-controlled, one-time):
#   1. terraform apply -var="enable_managed_kafka=true" -var="environment=prod"
#   2. Grant the prod backend GSA roles/managedkafka.client on the cluster.
#   3. Uncomment the configMapGenerator block below, replacing CLUSTER_ID with
#      the cluster_id from `terraform output managed_kafka_bootstrap`.
#   4. kubectl apply -k infra/k8s/overlays/prod (standard prod promotion).
# configMapGenerator:
#   - name: backend-go-config
#     behavior: merge
#     literals:
#       - KAFKA_BROKERS=bootstrap.CLUSTER_ID.asia-south1.managedkafka.pegasus-503013.cloud.goog:9092
#       - KAFKA_AUTH_MODE=GCP_MANAGED_OAUTH
#       - KAFKA_SASL_USERNAME=prod-backend@pegasus-503013.iam.gserviceaccount.com
#       - KAFKA_TOPIC_MAIN_DLQ=prod.events.orders-dlq
#       - KAFKA_TOPIC_DUAL_WRITE=false
#       - KAFKA_TOPIC_CONSUME_DOMAIN=false

patches:
  - path: ingress-managed-cert-patch.yaml
  - path: backend-go-externalsecret-patch.yaml
  - target:
      kind: Deployment
      name: optimizer-core
    patch: |-
      # Keep scaled to 0 until a real optimizer-core AR image exists; then raise ≥ 1.
      - op: replace
        path: /spec/replicas
        value: 0
