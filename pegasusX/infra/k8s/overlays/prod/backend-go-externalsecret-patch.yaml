# ESO v0.14+ Workload Identity fields for the live GKE cluster.
# Cluster name matches TF default: ${resource_prefix}-gke with tenant ssmr → pegasusx-ssmr-gke.
# GSM remoteRefs remain pegasusx-ssmr-* (ssmr-shaped tenant; see PROD_WIRING).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pegasusx-gsm
  namespace: pegasusx
spec:
  provider:
    gcpsm:
      projectID: pegasus-503013
      auth:
        workloadIdentity:
          clusterLocation: asia-south1
          clusterName: pegasusx-ssmr-gke
          clusterProjectID: pegasus-503013
          serviceAccountRef:
            name: backend-go
