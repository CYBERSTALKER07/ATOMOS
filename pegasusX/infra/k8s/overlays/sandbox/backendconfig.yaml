# GCE BackendConfig for SSMR API + WebSocket paths.
# Health path must be /healthz (root returns 404).
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: pegasusx-api-backendconfig
  labels:
    app.kubernetes.io/part-of: pegasusx
    pegasusx.io/environment: ssmr
spec:
  timeoutSec: 120
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /healthz
    port: 8080
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: pegasusx-ws-backendconfig
  labels:
    app.kubernetes.io/part-of: pegasusx
    pegasusx.io/environment: ssmr
spec:
  timeoutSec: 3600
  sessionAffinity:
    affinityType: GENERATED_COOKIE
    affinityCookieTtlSec: 3600
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /healthz
    port: 8080
