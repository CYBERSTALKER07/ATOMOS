# SSMR supplier-portal (static Next export + nginx)
# Image built via cloudbuild.supplier-portal.yaml from apps/supplier-portal/out
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplier-portal
  namespace: pegasusx-ssmr
  labels:
    app: supplier-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supplier-portal
  template:
    metadata:
      labels:
        app: supplier-portal
    spec:
      containers:
        - name: supplier-portal
          image: asia-south1-docker.pkg.dev/pegasus-503013/pegasusx-ssmr-images/supplier-portal:ssmr-supplier-portal-flywheel-a1fafaa0
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: supplier-portal
  namespace: pegasusx-ssmr
  labels:
    app: supplier-portal
spec:
  selector:
    app: supplier-portal
  ports:
    - name: http
      port: 80
      targetPort: 8080
