# SSMR GSM names for pegasus-503013 / tenant ssmr.
# Required GSM secrets must have at least one enabled version (phase0_sync or placeholders).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pegasusx-gsm
  namespace: pegasusx-ssmr
  labels:
    app.kubernetes.io/part-of: pegasusx
    pegasusx.io/environment: ssmr
spec:
  provider:
    gcpsm:
      projectID: pegasus-503013
      auth:
        workloadIdentity:
          # Required by ESO v0.14+ for GKE Workload Identity
          clusterLocation: asia-south1
          clusterName: pegasusx-ssmr-gke
          clusterProjectID: pegasus-503013
          serviceAccountRef:
            name: backend-go
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-go-secrets
  namespace: pegasusx-ssmr
  labels:
    app.kubernetes.io/part-of: pegasusx
    pegasusx.io/environment: ssmr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: pegasusx-gsm
    kind: SecretStore
  target:
    name: backend-go-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: pegasusx-ssmr-jwt-secret
    - secretKey: internal-api-key
      remoteRef:
        key: pegasusx-ssmr-internal-api-key
    - secretKey: global-pay-webhook-secret
      remoteRef:
        key: pegasusx-ssmr-global-pay-webhook-secret
    - secretKey: adyen-webhook-secret
      remoteRef:
        key: pegasusx-ssmr-adyen-webhook-secret
    - secretKey: stripe-webhook-secret
      remoteRef:
        key: pegasusx-ssmr-stripe-webhook-secret
    - secretKey: payme-webhook-secret
      remoteRef:
        key: pegasusx-ssmr-payme-webhook-secret
    - secretKey: click-webhook-secret
      remoteRef:
        key: pegasusx-ssmr-click-webhook-secret
    - secretKey: global-pay-service-id
      remoteRef:
        key: pegasusx-ssmr-global-pay-service-id
    - secretKey: global-pay-username
      remoteRef:
        key: pegasusx-ssmr-global-pay-username
    - secretKey: global-pay-password
      remoteRef:
        key: pegasusx-ssmr-global-pay-password
    - secretKey: google-maps-api-key
      remoteRef:
        key: pegasusx-ssmr-google-maps-api-key
    # Infra wiring (optional for app env; useful for bootstrap / debugging)
    - secretKey: redis-auth
      remoteRef:
        key: pegasusx-ssmr-redis-auth
    - secretKey: redis-addr
      remoteRef:
        key: pegasusx-ssmr-redis-addr
    - secretKey: kafka-bootstrap-servers
      remoteRef:
        key: pegasusx-ssmr-kafka-bootstrap-servers
