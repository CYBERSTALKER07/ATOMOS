# GCE Ingress for SSMR API.
# Static IP: reserve with
#   gcloud compute addresses create pegasusx-ssmr-api-ip --global --project=pegasus-503013
# DNS (after IP is assigned):
#   api-ssmr.pegasusx.app.  A  <ADDRESS>
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pegasusx-ssmr-api
  labels:
    app.kubernetes.io/part-of: pegasusx
    pegasusx.io/environment: ssmr
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "pegasusx-ssmr-api-ip"
    networking.gke.io/v1beta1.FrontendConfig: "pegasusx-ssmr-frontend"
    # Google-managed cert → Active only after DNS A record points here.
    networking.gke.io/managed-certificates: "pegasusx-ssmr-api-cert"
spec:
  # TLS via Google ManagedCertificate annotation (Active after DNS A → LB IP).
  # Do not attach a self-signed tls secretName — dual certs make SNI serve the
  # untrusted cert and break browsers on HSTS-preloaded .app domains.
  rules:
    - host: api-ssmr.pegasusx.app
      http:
        paths:
          - path: /v1/ws
            pathType: Prefix
            backend:
              service:
                name: backend-go-ws
                port:
                  number: 80
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: backend-go
                port:
                  number: 80
          - path: /partner
            pathType: Prefix
            backend:
              service:
                name: backend-go
                port:
                  number: 80
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: backend-go
                port:
                  number: 80
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: backend-go
                port:
                  number: 80
