apiVersion: apps/v1
kind: Deployment
metadata:
  name: osrm
  labels:
    app: osrm
    app.kubernetes.io/part-of: pegasusx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: osrm
  template:
    metadata:
      labels:
        app: osrm
        app.kubernetes.io/part-of: pegasusx
        cost-center: platform-engineering
        workload-tier: routing-engine
    spec:
      serviceAccountName: osrm-sa
      automountServiceAccountToken: false
      priorityClassName: pegasusx-mission-worker
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-extract
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              if [ ! -f /data/region.osrm ]; then
                echo "OSRM extract missing at /data/region.osrm — mount a prepared PVC (Gate-0)."
                exit 1
              fi
          volumeMounts:
            - name: osrm-data
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: osrm
          # Pin to a regional extract matching your launch geography (UZ/Central Asia).
          image: ghcr.io/project-osrm/osrm-backend:v5.27.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - osrm-routed
            - --algorithm
            - mld
            - /data/region.osrm
          ports:
            - name: http
              containerPort: 5000
          volumeMounts:
            - name: osrm-data
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /route/v1/driving/69.24,41.31;69.25,41.32
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /route/v1/driving/69.24,41.31;69.25,41.32
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /route/v1/driving/69.24,41.31;69.25,41.32
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
      volumes:
        - name: osrm-data
          persistentVolumeClaim:
            claimName: osrm-data
