apiVersion: apps/v1
kind: Deployment
metadata:
  name: osrm
  labels:
    app: osrm
    app.kubernetes.io/part-of: pegasusx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: osrm
  template:
    metadata:
      labels:
        app: osrm
    spec:
      initContainers:
        - name: wait-for-extract
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f /data/region.osrm ]; then
                echo "OSRM extract missing at /data/region.osrm — mount a prepared PVC (Gate-0)."
                exit 1
              fi
          volumeMounts:
            - name: osrm-data
              mountPath: /data
      containers:
        - name: osrm
          # Pin to a regional extract matching your launch geography (UZ/Central Asia).
          image: ghcr.io/project-osrm/osrm-backend:v5.27.1
          args:
            - osrm-routed
            - --algorithm
            - mld
            - /data/region.osrm
          ports:
            - name: http
              containerPort: 5000
          volumeMounts:
            - name: osrm-data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /route/v1/driving/69.24,41.31;69.25,41.32
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /route/v1/driving/69.24,41.31;69.25,41.32
              port: http
            initialDelaySeconds: 60
            periodSeconds: 60
      volumes:
        - name: osrm-data
          persistentVolumeClaim:
            claimName: osrm-data
