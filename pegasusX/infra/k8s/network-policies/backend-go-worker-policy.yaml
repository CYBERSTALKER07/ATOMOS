apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-go-worker-network-policy
  namespace: pegasusx
  labels:
    app: backend-go-worker
    app.kubernetes.io/part-of: pegasusx
    security.pegasusx.io/tier: zero-trust
spec:
  podSelector:
    matchLabels:
      app: backend-go-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. Allow Google Managed Prometheus / monitoring scraper and kubelet probes on port 8081
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # 1. DNS Resolution (kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Allow call to optimizer-core on port 8082
    - to:
        - podSelector:
            matchLabels:
              app: optimizer-core
      ports:
        - protocol: TCP
          port: 8082
    # 3. Allow Redis Memorystore
    - ports:
        - protocol: TCP
          port: 6379
    # 4. Allow Managed Apache Kafka
    - ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 29092
    # 5. Allow Google Cloud APIs (Cloud Spanner, GCS, Cloud KMS, Firebase, Partner Webhooks) via HTTPS
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 9010
        - protocol: TCP
          port: 9020
