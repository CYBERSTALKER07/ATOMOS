apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: batch-cron-network-policy
  namespace: pegasusx
  labels:
    app.kubernetes.io/part-of: pegasusx
    security.pegasusx.io/tier: zero-trust
spec:
  podSelector:
    matchLabels:
      workload-tier: batch-cron
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # 1. DNS Resolution (kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Allow internal API calls to backend-go (e.g. billing_monthly_cronjob -> Service:80 -> Pod:8080)
    - to:
        - podSelector:
            matchLabels:
              app: backend-go
      ports:
        - protocol: TCP
          port: 8080
    # 3. Allow Redis Memorystore (6379 plaintext / 6378 TLS)
    - ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 6378
    # 4. Allow Managed Apache Kafka
    - ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 29092
    # 5. Allow Google Cloud APIs (Cloud Spanner, GCS, Cloud KMS, FCM) via HTTPS/gRPC
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 9010
        - protocol: TCP
          port: 9020
