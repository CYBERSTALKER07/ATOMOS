apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: osrm-network-policy
  namespace: pegasusx
  labels:
    app: osrm
    app.kubernetes.io/part-of: pegasusx
    security.pegasusx.io/tier: zero-trust
spec:
  podSelector:
    matchLabels:
      app: osrm
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. Strictly allow routing requests from backend-go, backend-go-worker, and ai-worker on port 5000
    - from:
        - podSelector:
            matchLabels:
              app: backend-go
        - podSelector:
            matchLabels:
              app: backend-go-worker
        - podSelector:
            matchLabels:
              app: ai-worker
      ports:
        - protocol: TCP
          port: 5000
    # 2. Allow Prometheus / GMP monitoring scraper on port 5000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gke-gmp-system
      ports:
        - protocol: TCP
          port: 5000
  egress:
    # 1. DNS Resolution (kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
