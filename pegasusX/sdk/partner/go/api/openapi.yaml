openapi: 3.0.3
info:
  description: |
    Gate-3 machine integration surface (§8.9). Authenticate with a partner API key
    (`Authorization: Bearer pxk_…`) **or** a short-lived OAuth2 access token from
    `POST /partner/v1/oauth/token` (`grant_type=client_credentials`; `PartnerApiKeys` are the clients).
    Human JWT sessions issue keys via `/v1/admin/partner-keys` (supplier aliases under `/v1/supplier/…`).
    Wave 2A: bulk exports + webhook ops + SFTP. Wave 2B: EDI-lite. Wave 2C: GS1. Journals + configurable CoA.
    AS2 transport over EDI-lite (not Drummond-certified).
    Phase 2: master-data upsert (products/prices/stock), webhook secret rotation, POS demand feed,
    CONTRL/APERAK + inbound ORDRSP/INVOIC, SFTP host-key pinning, GS1 DataMatrix AI scaffolding.
  title: PegasusX Partner API
  version: 1.5.0
servers:
- description: SSMR
  url: https://api-ssmr.pegasusx.app
paths:
  /partner/v1/oauth/token:
    post:
      operationId: partnerOAuthToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerOAuthTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PartnerOAuthTokenRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerOAuthTokenResponse'
          description: Access token
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerOAuthError'
          description: OAuth error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerOAuthError'
          description: Invalid client
      security: []
      summary: OAuth2 client_credentials token
  /partner/v1/orders:
    post:
      operationId: partnerCreateOrder
      parameters:
      - explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCreateOrderRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCreateOrderResponse'
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
        "403":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
      security:
      - PartnerApiKey:
        - orders:write
      summary: Create order
  /partner/v1/orders/{orderID}:
    get:
      operationId: partnerGetOrder
      parameters:
      - explode: false
        in: path
        name: orderID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Order
        "404":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
      security:
      - PartnerApiKey:
        - orders:read
      summary: Get order (tenant-scoped; IDOR fail-closed)
  /partner/v1/catalog:
    get:
      operationId: partnerListCatalog
      parameters:
      - explode: true
        in: query
        name: supplier_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: retailer_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: category_id
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: Products
      security:
      - PartnerApiKey:
        - catalog:read
      summary: Catalog with resolved prices / stock enrichment
  /partner/v1/catalog/products:
    put:
      operationId: partnerUpsertProducts
      parameters:
      - explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerProductUpsertRequest'
        required: true
      responses:
        "200":
          description: Per-row results
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
        "403":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
      security:
      - PartnerApiKey:
        - catalog:write
      summary: Batch upsert products by external_id (ProductId == external_id)
  /partner/v1/catalog/prices:
    put:
      operationId: partnerUpsertPrices
      parameters:
      - explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerPriceUpsertRequest'
        required: true
      responses:
        "200":
          description: Per-row results
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
      security:
      - PartnerApiKey:
        - catalog:write
      summary: Batch upsert list prices by external_id
  /partner/v1/inventory/availability:
    get:
      operationId: partnerInventoryAvailability
      parameters:
      - explode: true
        in: query
        name: supplier_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: retailer_id
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated product IDs
        explode: true
        in: query
        name: product_ids
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: Availability rows
      security:
      - PartnerApiKey:
        - inventory:read
      summary: On-hand minus reserved availability
  /partner/v1/inventory/stock:
    put:
      operationId: partnerUpsertStock
      parameters:
      - explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerStockUpsertRequest'
        required: true
      responses:
        "200":
          description: Per-row results
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
      security:
      - PartnerApiKey:
        - inventory:write
      summary: Batch set absolute on-hand stock by external_id × warehouse
  /partner/v1/demand/pos-feed:
    post:
      operationId: partnerPOSDemandFeed
      parameters:
      - explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerPOSDemandFeedRequest'
        required: true
      responses:
        "202":
          description: Accepted
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
      security:
      - PartnerApiKey:
        - demand:write
      summary: Ingest POS sell-through demand signals (retail chain → planning)
  /partner/v1/webhooks:
    get:
      operationId: partnerListWebhooks
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/partnerListWebhooks_200_response'
          description: Subscriptions
      security:
      - PartnerApiKey:
        - webhooks:manage
      summary: List webhook subscriptions (secret omitted; secret_prefix only)
    post:
      operationId: partnerCreateWebhook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/partnerCreateWebhook_request'
        required: true
      responses:
        "201":
          description: Created (signing_secret shown once)
      security:
      - PartnerApiKey:
        - webhooks:manage
      summary: Create outbound webhook subscription
  /partner/v1/webhooks/{subscriptionID}:
    delete:
      operationId: partnerDeactivateWebhook
      parameters:
      - explode: false
        in: path
        name: subscriptionID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Deactivated
      security:
      - PartnerApiKey:
        - webhooks:manage
      summary: Deactivate webhook subscription
  /partner/v1/webhooks/{subscriptionID}/ping:
    post:
      operationId: partnerPingWebhook
      parameters:
      - explode: false
        in: path
        name: subscriptionID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Delivered
      security:
      - PartnerApiKey:
        - webhooks:manage
      summary: Send signed test delivery
  /partner/v1/webhooks/{subscriptionID}/rotate-secret:
    post:
      operationId: partnerRotateWebhookSecret
      parameters:
      - explode: false
        in: path
        name: subscriptionID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: New signing_secret shown once
        "404":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
      security:
      - PartnerApiKey:
        - webhooks:manage
      summary: Rotate HMAC signing secret (returned once)
  /partner/v1/webhooks/dead-letter:
    get:
      operationId: partnerListDeadLetter
      responses:
        "200":
          description: Attempts
      security:
      - PartnerApiKey:
        - webhooks:manage
      summary: List dead-letter delivery attempts
  /partner/v1/webhooks/dead-letter/{attemptID}/replay:
    post:
      operationId: partnerReplayDeadLetter
      parameters:
      - explode: false
        in: path
        name: attemptID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Requeued as PENDING
        "404":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
      security:
      - PartnerApiKey:
        - webhooks:manage
      summary: Requeue a DEAD delivery attempt (full retry budget)
  /partner/v1/exports:
    get:
      operationId: partnerListExports
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/partnerListExports_200_response'
          description: Jobs
      security:
      - PartnerApiKey:
        - exports:read
      summary: List recent export jobs for the key tenant
    post:
      operationId: partnerCreateExport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCreateExportRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerExportJob'
          description: Accepted
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
      security:
      - PartnerApiKey:
        - exports:read
      summary: Create async bulk export job
  /partner/v1/exports/{jobID}:
    get:
      operationId: partnerGetExport
      parameters:
      - explode: false
        in: path
        name: jobID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerExportJob'
          description: Job
        "404":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
      security:
      - PartnerApiKey:
        - exports:read
      summary: Get export job status (+ signed download_url when SUCCEEDED)
  /partner/v1/coa:
    get:
      operationId: partnerGetCoa
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCoaMap'
          description: Resolved CoA (defaults when unset)
      security:
      - PartnerApiKey:
        - exports:read
      summary: Get tenant chart of accounts for journals exports
    put:
      operationId: partnerPutCoa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCoaMapUpdate'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCoaMap'
          description: Saved CoA
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
      security:
      - PartnerApiKey:
        - exports:read
      summary: Upsert tenant chart of accounts for journals exports
  /partner/v1/as2:
    post:
      description: Unauthenticated RFC 4130 receive; identity via AS2-From/AS2-To
        + PKCS7. Sync MDN response.
      operationId: partnerAs2Receive
      responses:
        "200":
          description: Sync MDN (multipart/report)
        "400":
          description: Missing AS2 headers
        "503":
          description: AS2 disabled
      security: []
      summary: AS2 receive (EDI-lite ORDERS)
  /partner/v1/as2/config:
    get:
      operationId: partnerGetAs2Config
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAs2Config'
          description: AS2 config (no PEM material)
      security:
      - PartnerApiKey:
        - exports:read
      summary: Get tenant AS2 station config
    put:
      operationId: partnerPutAs2Config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerAs2ConfigUpdate'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAs2Config'
          description: Saved AS2 config
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
      security:
      - PartnerApiKey:
        - exports:read
      summary: Upsert tenant AS2 station config
  /partner/v1/edi/documents:
    get:
      operationId: partnerListEdiDocuments
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/partnerListEdiDocuments_200_response'
          description: Documents
      security:
      - PartnerApiKey:
        - exports:read
      summary: List recent EDI-lite documents for the key tenant
  /partner/v1/edi/documents/{documentID}:
    get:
      operationId: partnerGetEdiDocument
      parameters:
      - explode: false
        in: path
        name: documentID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerEdiDocument'
          description: Document
        "404":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
      security:
      - PartnerApiKey:
        - exports:read
      summary: Get EDI document status
  /partner/v1/edi/documents/{documentID}/replay:
    post:
      operationId: partnerReplayEdiDocument
      parameters:
      - explode: false
        in: path
        name: documentID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Requeued as RECEIVED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/partnerCreateOrder_401_response'
          description: Problem+JSON error
      security:
      - PartnerApiKey:
        - exports:read
      summary: Requeue FAILED/EMITTED EDI document
  /v1/admin/partner-keys:
    get:
      operationId: listPartnerApiKeys
      responses:
        "200":
          description: Keys metadata
      security:
      - BearerJWT: []
      summary: List partner keys for caller tenant
    post:
      operationId: issuePartnerApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/issuePartnerApiKey_request'
      responses:
        "201":
          description: Key issued (secret once)
      security:
      - BearerJWT: []
      summary: Issue partner API key (human JWT)
components:
  parameters:
    IdempotencyKey:
      explode: false
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
      style: simple
  responses:
    Problem:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/partnerCreateOrder_401_response'
      description: Problem+JSON error
  schemas:
    PartnerCreateOrderRequest:
      example:
        lng: 1.4658129805029452
        retailer_id: retailer_id
        line_items:
        - quantity: 0
          sku: sku
        - quantity: 0
          sku: sku
        supplier_id: supplier_id
        h3_cell: h3_cell
        lat: 6.027456183070403
      properties:
        supplier_id:
          description: Required for RETAILER keys
          type: string
        retailer_id:
          description: Required for SUPPLIER keys
          type: string
        line_items:
          items:
            $ref: '#/components/schemas/PartnerCreateOrderRequest_line_items_inner'
          type: array
        h3_cell:
          type: string
        lat:
          type: number
        lng:
          type: number
      required:
      - lat
      - line_items
      - lng
      type: object
    PartnerCreateOrderResponse:
      example:
        total_minor: 0
        currency: currency
        order_id: order_id
        status: status
      properties:
        order_id:
          type: string
        status:
          type: string
        total_minor:
          type: integer
        currency:
          type: string
      type: object
    PartnerWebhookSubscription:
      example:
        subscription_id: subscription_id
        is_active: true
        event_types:
        - event_types
        - event_types
        secret_prefix: secret_prefix
        created_at: 2000-01-23T04:56:07.000+00:00
        url: url
      properties:
        subscription_id:
          type: string
        url:
          type: string
        event_types:
          items:
            type: string
          type: array
        is_active:
          type: boolean
        secret_prefix:
          type: string
        created_at:
          format: date-time
          type: string
      type: object
    PartnerCreateExportRequest:
      example:
        resource: orders
        format: csv
        from: from
        to: to
      properties:
        resource:
          enum:
          - orders
          - invoices
          - inventory
          - ledger
          - journals
          type: string
        format:
          default: csv
          enum:
          - csv
          - json
          - xml
          type: string
        from:
          description: RFC3339 or YYYY-MM-DD
          type: string
        to:
          description: RFC3339 or YYYY-MM-DD
          type: string
      required:
      - resource
      type: object
    PartnerCoaMap:
      example:
        account_bank_cash: "51.01"
        account_revenue: "90.01"
        updated_at: 2000-01-23T04:56:07.000+00:00
        updated_by: updated_by
        account_ar: "62.01"
        using_defaults: true
      properties:
        account_ar:
          example: "62.01"
          type: string
        account_revenue:
          example: "90.01"
          type: string
        account_bank_cash:
          example: "51.01"
          type: string
        using_defaults:
          type: boolean
        updated_at:
          format: date-time
          type: string
        updated_by:
          type: string
      type: object
    PartnerCoaMapUpdate:
      example:
        account_bank_cash: account_bank_cash
        account_revenue: account_revenue
        account_ar: account_ar
      properties:
        account_ar:
          type: string
        account_revenue:
          type: string
        account_bank_cash:
          type: string
      type: object
    PartnerAs2Config:
      example:
        configured: true
        as2_enabled: true
        partner_as2_id: partner_as2_id
        sign_required: true
        partner_cert_secret_ref: partner_cert_secret_ref
        partner_url: partner_url
        our_key_secret_ref: our_key_secret_ref
        our_cert_secret_ref: our_cert_secret_ref
        our_as2_id: our_as2_id
        encrypt_required: true
      properties:
        configured:
          type: boolean
        as2_enabled:
          type: boolean
        our_as2_id:
          type: string
        partner_as2_id:
          type: string
        partner_url:
          type: string
        our_cert_secret_ref:
          type: string
        our_key_secret_ref:
          type: string
        partner_cert_secret_ref:
          type: string
        sign_required:
          type: boolean
        encrypt_required:
          type: boolean
      type: object
    PartnerAs2ConfigUpdate:
      example:
        as2_enabled: true
        partner_as2_id: partner_as2_id
        sign_required: true
        partner_cert_secret_ref: partner_cert_secret_ref
        partner_url: partner_url
        our_key_secret_ref: our_key_secret_ref
        our_cert_secret_ref: our_cert_secret_ref
        our_as2_id: our_as2_id
        encrypt_required: true
      properties:
        as2_enabled:
          type: boolean
        our_as2_id:
          type: string
        partner_as2_id:
          type: string
        partner_url:
          type: string
        our_cert_secret_ref:
          type: string
        our_key_secret_ref:
          type: string
        partner_cert_secret_ref:
          type: string
        sign_required:
          type: boolean
        encrypt_required:
          type: boolean
      type: object
    PartnerOAuthTokenRequest:
      example:
        grant_type: client_credentials
        scope: scope
        client_secret: client_secret
        client_id: client_id
      properties:
        grant_type:
          enum:
          - client_credentials
          type: string
        client_id:
          description: PartnerApiKeys.KeyId or KeyPrefix
          type: string
        client_secret:
          description: Full pxk_… plaintext
          type: string
        scope:
          description: Space-separated subset of key scopes
          type: string
      required:
      - client_secret
      - grant_type
      type: object
    PartnerOAuthTokenResponse:
      example:
        access_token: access_token
        scope: scope
        token_type: Bearer
        expires_in: 0
      properties:
        access_token:
          type: string
        token_type:
          example: Bearer
          type: string
        expires_in:
          type: integer
        scope:
          type: string
      required:
      - access_token
      - expires_in
      - token_type
      type: object
    PartnerOAuthError:
      example:
        error_description: error_description
        error: error
      properties:
        error:
          type: string
        error_description:
          type: string
      type: object
    PartnerExportJob:
      example:
        tenant_id: tenant_id
        sftp_status: SKIPPED
