<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate PWA Icons with Black Background</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0a0a0a;
            color: white;
        }
        .container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid white;
        }
        h1 { margin-top: 0; }
        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
            background: black;
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
        }
        button {
            background: white;
            color: black;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #FFA500;
        }
        #preview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .preview-item {
            text-align: center;
            background: black;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid white;
        }
        .preview-item canvas {
            border: 1px solid #333;
            border-radius: 8px;
        }
        .preview-item p {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Generate PWA Icons with Black Background</h1>
        <p>Upload your logo/icon image and generate PWA icons with black backgrounds for all required sizes.</p>
        
        <input type="file" id="imageInput" accept="image/*">
        <br>
        <button onclick="generateIcons()">Generate Icons</button>
        
        <div id="preview"></div>
    </div>

    <script>
        let uploadedImage = null;

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        uploadedImage = img;
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function generateIcons() {
            if (!uploadedImage) {
                alert('Please upload an image first!');
                return;
            }

            const sizes = [192, 384, 512];
            const preview = document.getElementById('preview');
            preview.innerHTML = '';

            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                // Fill with black background
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, size, size);

                // Calculate scaling to fit icon with padding
                const padding = size * 0.15; // 15% padding
                const maxSize = size - (padding * 2);
                const scale = Math.min(maxSize / uploadedImage.width, maxSize / uploadedImage.height);
                const scaledWidth = uploadedImage.width * scale;
                const scaledHeight = uploadedImage.height * scale;

                // Center the icon
                const x = (size - scaledWidth) / 2;
                const y = (size - scaledHeight) / 2;

                // Draw the icon
                ctx.drawImage(uploadedImage, x, y, scaledWidth, scaledHeight);

                // Create preview
                const previewCanvas = document.createElement('canvas');
                previewCanvas.width = 150;
                previewCanvas.height = 150;
                const previewCtx = previewCanvas.getContext('2d');
                previewCtx.drawImage(canvas, 0, 0, 150, 150);

                const previewItem = document.createElement('div');
                previewItem.className = 'preview-item';
                previewItem.innerHTML = `
                    <canvas width="150" height="150"></canvas>
                    <p>${size}x${size}</p>
                    <button onclick="downloadIcon(${size})">Download</button>
                `;
                previewItem.querySelector('canvas').getContext('2d').drawImage(canvas, 0, 0, 150, 150);
                preview.appendChild(previewItem);

                // Store canvas for download
                window[`canvas_${size}`] = canvas;
            });
        }

        function downloadIcon(size) {
            const canvas = window[`canvas_${size}`];
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `web-app-manifest-${size}x${size}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        }
    </script>
</body>
</html>
