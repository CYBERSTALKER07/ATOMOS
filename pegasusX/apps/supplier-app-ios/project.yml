name: SupplierAppIOS
options:
  bundleIdPrefix: com.pegasusx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_NSCameraUsageDescription: "Scan product barcodes when adding catalog EAN/GTIN"
targets:
  SupplierAppIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SupplierApp
        excludes:
          - "**/.DS_Store"
      - path: ../../packages/mobile-ios-barcode
        includes:
          - EANBarcodeScannerView.swift
          - EANBarcode.swift
      - path: ../../packages/mobile-ios-design
    resources:
      - path: SupplierApp/Assets.xcassets
      - path: SupplierApp/GoogleService-Info.plist
    info:
      path: SupplierApp/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pegasusx.supplier
        INFOPLIST_FILE: SupplierApp/Info.plist
  SupplierAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SupplierAppTests
    dependencies:
      - target: SupplierAppIOS
