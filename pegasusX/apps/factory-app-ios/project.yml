name: FactoryAppIOS
options:
  bundleIdPrefix: com.pegasusx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    TARGETED_DEVICE_FAMILY: "2"
    INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Receive factory operations alerts"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FactoryAppIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
    sources:
      - path: FactoryApp
        excludes:
          - "**/.DS_Store"
          - "Views/Components/LoadingBay/PayloadOverrideView.swift"
      - path: ../../packages/mobile-ios-design
    resources:
      # pegasusx-i18n-generated
      - path: ../../packages/i18n/generated/ios/en.lproj
      - path: ../../packages/i18n/generated/ios/ru.lproj
      - path: ../../packages/i18n/generated/ios/uz.lproj
      - path: FactoryApp/Assets.xcassets
      - path: FactoryApp/Preview Assets.xcassets
      - path: FactoryApp/GoogleService-Info.plist
    info:
      path: FactoryApp/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pegasusx.factory-app
        INFOPLIST_FILE: FactoryApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: FactoryApp/FactoryApp.entitlements
  FactoryAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FactoryAppTests
    dependencies:
      - target: FactoryAppIOS
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.6.0
