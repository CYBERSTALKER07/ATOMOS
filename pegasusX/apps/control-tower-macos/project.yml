name: PegasusControlTower
options:
  bundleIdPrefix: com.pegasusx
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    COMBINE_HIDPI_IMAGES: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    PRODUCT_MODULE_NAME: PegasusControlTower
targets:
  PegasusControlTower:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pegasusx.controltower
        PRODUCT_NAME: PegasusControlTower
        PRODUCT_MODULE_NAME: PegasusControlTower
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pegasus Control Tower
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 PegasusX Inc. All rights reserved."
        INFOPLIST_KEY_NSHighResolutionCapable: YES
  PegasusControlTowerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Models
      - path: Sources/Services
      - path: Sources/ViewModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pegasusx.controltower.tests
        PRODUCT_NAME: PegasusControlTowerTests
        PRODUCT_MODULE_NAME: PegasusControlTowerTests
