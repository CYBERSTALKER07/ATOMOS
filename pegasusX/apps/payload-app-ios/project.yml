name: payload-app-ios
options:
  bundleIdPrefix: com.pegasus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    TARGETED_DEVICE_FAMILY: "2" # iPad only
    INFOPLIST_KEY_NSCameraUsageDescription: "Scan product barcodes during inbound returns and manifest loading"
    INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Receive load-out and dispatch alerts"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.6.0
targets:
  payload-app-ios:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    preBuildScripts:
      - name: Generate Native Event Contracts
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/local/go/bin:$PATH"
          REPO_ROOT="$SRCROOT/../.."
          BACKEND_DIR="$REPO_ROOT/apps/backend-go"
          SCHEMA_PATH="$REPO_ROOT/contracts/events.schema.json"
          OUTPUT_PATH="$SRCROOT/payload-app-ios/Generated/PegasusWSEventEnvelope.swift"

          if ! command -v quicktype >/dev/null 2>&1; then
            echo "error: quicktype not found. Install quicktype and ensure it is on PATH." >&2
            exit 1
          fi

          mkdir -p "$SRCROOT/payload-app-ios/Generated"
          cd "$BACKEND_DIR"
          go run ./cmd/gen-contracts -source events/events.go -mode json-schema -schema-out "$SCHEMA_PATH" -pretty=true
          quicktype --lang swift --src-lang schema --src "$SCHEMA_PATH" --top-level PegasusWSEventEnvelope --out "$OUTPUT_PATH"
        outputFiles:
          - "$(SRCROOT)/payload-app-ios/Generated/PegasusWSEventEnvelope.swift"
    sources:
      - path: payload-app-ios
        excludes:
          - "**/.DS_Store"
      - path: ../../packages/mobile-ios-barcode
        includes:
          - EANBarcodeScannerView.swift
      - path: ../../packages/mobile-ios-design
    resources:
      - path: payload-app-ios/Assets.xcassets
    info:
      path: payload-app-ios/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pegasus.payload
        INFOPLIST_FILE: payload-app-ios/Info.plist
