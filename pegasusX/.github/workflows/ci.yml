name: pegasusX CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: .

jobs:
  backend-unit:
    uses: ./.github/workflows/ci-unit-tests-go.yml
    with:
      working-directory: apps/backend-go
      go-version: "1.25"

  backend:
    needs: backend-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Parity contract (narrow)
        run: make parity-contract
      - name: Parity contract (full)
        run: make parity-contract-full
      - name: Gap hunter gate
        run: make gap-hunter-gate
      - name: Gen-contracts gate
        run: make gen-contracts-gate
      - name: Validate backend K8s manifests
        run: make validate-backend-k8s
      - name: Validate ai-worker K8s manifests
        run: make validate-ai-worker-k8s
      - name: Validate all Kubernetes manifests and overlays
        run: make validate-all-k8s
      - name: Fail on placeholder / :latest prod images
        run: bash scripts/ci_fail_placeholder_images.sh infra/k8s/overlays/prod
      - name: Fail on TODO:Inject orphaned-client placeholders
        run: bash scripts/ci_fail_todo_inject.sh
      - name: No mock Control Tower strings in retailer clients
        run: bash scripts/ci_no_mock_control_tower.sh
      - name: Wire-ready gate (prod profile + parity + k8s; no sandbox compose in this job — see sandbox-infra workflow)
        run: |
          bash scripts/validate_production_profile.sh
          make parity-contract-full
          make gap-hunter-gate
          make gen-contracts-gate
          make validate-backend-k8s
          make validate-ai-worker-k8s
          make validate-all-k8s
          kubectl kustomize infra/k8s/overlays/prod --load-restrictor LoadRestrictionsNone >/dev/null

  cell-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Cell backend guard + isolation proof
        run: |
          make cell-backend-guard
          make cell-isolation-proof
      - name: Validate sandbox kustomize overlay
        run: kubectl kustomize infra/k8s/overlays/sandbox --load-restrictor LoadRestrictionsNone >/dev/null
      - name: Layer A apply-guard (no unattended Terraform)
        run: bash scripts/ci_no_unattended_terraform_apply.sh

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v1.64.6
          working-directory: apps/backend-go
          args: --config=${{ github.workspace }}/.golangci.yml --timeout=8m
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd apps/backend-go
          govulncheck ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  backend-spanner:
    runs-on: ubuntu-latest
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:latest
        ports:
          - 9010:9010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Spanner emulator integration tests
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
        run: bash scripts/ci_spanner_integration.sh
      - name: Schema-drift gate (shop-closed / proximity)
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
        run: bash scripts/ci_schema_drift_gate.sh
      - name: Phase-0 money-path gate (capture/idempotency/credit proofs)
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
        run: bash scripts/money_path_gate.sh
      - name: Phase-1 gate (AR/refund/payout/billing + Soliq + GP simulator)
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
        run: bash scripts/phase1_gate.sh

  # P2-18: Phase 2–5c + analytics-tenancy were local-only; keep them green in CI.
  # Depends on backend-spanner so Phase-0/1 already passed; nested Phase-1 is skipped.
  enterprise-gates:
    needs: backend-spanner
    runs-on: ubuntu-latest
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:latest
        ports:
          - 9010:9010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enterprise gates (phase2→5c + analytics-tenancy)
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
        run: bash scripts/ci_enterprise_gates.sh

  ai-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build and test ai-worker
        run: |
          cd apps/ai-worker
          go build ./...
          go vet ./...
          go test -v ./...

  handoff-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build and test handoff-service
        run: |
          cd apps/handoff-service
          go build ./...
          go vet ./...
          go test -v ./...

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/terraform
      - name: Terraform validate modules
        run: |
          for dir in infra/terraform/modules/*; do
            if [ -d "$dir" ]; then
              echo "Validating $dir"
              (cd "$dir" && terraform init -backend=false && terraform validate)
            fi
          done

  optimizer-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Test optimizer-core services
        run: bash scripts/ci_optimizer_core.sh

  trivy-security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner on IaC and K8s manifests
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: 'config'
          scan-ref: 'infra/k8s'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      - name: Run Trivy Dockerfile scanner
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: 'config'
          scan-ref: 'apps/backend-go/Dockerfile'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  android-apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - driver-app-android
          - factory-app-android
          - payload-app-android
          - retailer-app-android
          - supplier-app-android
          - warehouse-app-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Unit test ${{ matrix.app }}
        run: bash scripts/ci_android_unit_tests.sh "${{ matrix.app }}"

  ios-apps:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: supplier
            project: apps/supplier-app-ios/SupplierAppIOS.xcodeproj
            scheme: SupplierAppIOS
            xcodegen_dir: apps/supplier-app-ios
            unit_test: SupplierAppTests
          - name: warehouse
            project: apps/warehouse-app-ios/WarehouseAppIOS.xcodeproj
            scheme: WarehouseAppIOS
            xcodegen_dir: apps/warehouse-app-ios
            unit_test: WarehouseAppTests
          - name: factory
            project: apps/factory-app-ios/FactoryAppIOS.xcodeproj
            scheme: FactoryAppIOS
            xcodegen_dir: apps/factory-app-ios
            unit_test: FactoryAppTests
          - name: payload
            project: apps/payload-app-ios/payload-app-ios.xcodeproj
            scheme: payload-app-ios
            xcodegen_dir: apps/payload-app-ios
            unit_test: ""
          - name: driver
            project: apps/driver-app-ios/driverappios/driverappios.xcodeproj
            scheme: driverappios
            xcodegen_dir: ""
            unit_test: driverappiosTests
          - name: retailer
            project: apps/retailer-app-ios/retailerapp/retailerapp.xcodeproj
            scheme: retailerapp
            xcodegen_dir: ""
            unit_test: retailerappTests
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        if: matrix.xcodegen_dir != ''
        run: brew install xcodegen
      - name: Generate project
        if: matrix.xcodegen_dir != ''
        working-directory: ${{ matrix.xcodegen_dir }}
        run: xcodegen generate
      - name: Build ${{ matrix.name }} (simulator)
        working-directory: .
        run: |
          xcodebuild \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Unit test ${{ matrix.name }}
        if: matrix.unit_test != ''
        run: |
          set -euo pipefail
          SIM_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && $0 !~ /unavailable/ { print $2; exit }')"
          if [[ -z "${SIM_ID}" ]]; then
            echo "no available iPhone simulator"
            exit 1
          fi
          xcodebuild test \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -destination "platform=iOS Simulator,id=${SIM_ID}" \
            -only-testing:"${{ matrix.unit_test }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  supplier-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install workspace
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Desktop bridge tests
        run: pnpm --filter @pegasusx/desktop-bridge test
      - name: Desktop cache tests
        run: pnpm --filter @pegasusx/desktop-cache test
      - name: Vitest all Tauri desktop clients (PX-DESK-5A)
        run: |
          pnpm --filter @pegasusx/retailer-app-desktop test
          pnpm --filter @pegasusx/supplier-portal test
          pnpm --filter @pegasusx/warehouse-portal test
          pnpm --filter @pegasusx/factory-portal test
      - name: Typecheck all Tauri desktop clients
        run: |
          pnpm --filter @pegasusx/retailer-app-desktop typecheck
          pnpm --filter @pegasusx/supplier-portal typecheck
          pnpm --filter @pegasusx/warehouse-portal typecheck
          pnpm --filter @pegasusx/factory-portal typecheck
      - name: Validate desktop updater config
        env:
          ALLOW_DEV_UPDATER_PUBKEY: "1"
        run: bash scripts/validate_desktop_updater.sh

  # P2-18: admin-portal had no CI job.
  admin-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install workspace
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Typecheck admin-portal
        run: pnpm --filter @pegasusx/admin-portal typecheck
      - name: Build admin-portal
        run: pnpm --filter @pegasusx/admin-portal build
