# Nested copy kept in sync with repo-root workflow.
# GitHub Actions only loads workflows from the repository root `.github/workflows/`.
# Canonical workflow: /.github/workflows/pegasusx-desktop-build.yml
name: Desktop Windows Build (legacy path)

on:
  workflow_dispatch:

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Use root workflow
        run: |
          echo "This nested workflow is not executed by GitHub."
          echo "Run: Actions → PegasusX Desktop Build (Windows + Linux)"
          exit 0
